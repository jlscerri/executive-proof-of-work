<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <style>
    :root {
      --text:#0F172A;
      --muted:#55606E;
      --line:#C7CDD6;
      --accent:#2354C9;
      --dot:#2354C9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text:#E6EDF3;
        --muted:#9AA5B1;
        --line:#3A4250;
        --accent:#6EA0FF;
        --dot:#6EA0FF;
      }
    }
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"DejaVu Sans",sans-serif; }
    .label { fill:var(--accent); font-weight:700; letter-spacing:.06em; }
    .title { fill:var(--text); font-weight:700; }
    .sub { fill:var(--muted); font-weight:400; }
    .line { stroke:var(--line); }
    .accentline { stroke:var(--accent); }
    .arrowhead { fill:var(--accent); }
    .dot { fill:var(--dot); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
    </marker>
  </defs>

<text x="40" y="40" font-size="14" text-anchor="start" class="label" >SELECTED EXECUTIVE PROGRESSION</text>
<text x="40" y="62" font-size="13" text-anchor="start" class="sub" >Representative roles from the case studies below — not a complete employment history.</text>
<line x1="90" y1="210" x2="960" y2="210" stroke-width="2" class="line" marker-end="url(#arrow)"/>
<line x1="90" y1="216" x2="90" y2="236" stroke-width="1.5" class="line" />
<circle cx="90" cy="210" r="6" class="dot" />
<text x="90" y="250" font-size="13" text-anchor="start" class="label" >Feb 2006 – Nov 2009</text>
<text x="90" y="273" font-size="16" text-anchor="start" class="title" >Brikensa España S.A.</text>
<text x="90" y="297" font-size="12.5" text-anchor="start" class="sub" >Regional Sales Director,</text>
<text x="90" y="314" font-size="12.5" text-anchor="start" class="sub" >Northern Spain</text>
<line x1="264" y1="204" x2="264" y2="66" stroke-width="1.5" class="line" />
<circle cx="264" cy="210" r="6" class="dot" />
<text x="264" y="80" font-size="13" text-anchor="middle" class="label" >2009 – 2021</text>
