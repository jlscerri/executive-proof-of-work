<text x="264" y="127" font-size="12.5" text-anchor="middle" class="sub" >Sales Manager →</text>
<text x="264" y="144" font-size="12.5" text-anchor="middle" class="sub" >VP Sales &amp; Marketing Global</text>
<line x1="438" y1="216" x2="438" y2="236" stroke-width="1.5" class="line" />
<circle cx="438" cy="210" r="6" class="dot" />
<text x="438" y="250" font-size="13" text-anchor="middle" class="label" >2021 – 2022</text>
<text x="438" y="273" font-size="16" text-anchor="middle" class="title" >Crimson Education</text>
<text x="438" y="297" font-size="12.5" text-anchor="middle" class="sub" >Country Manager →</text>
<text x="438" y="314" font-size="12.5" text-anchor="middle" class="sub" >Chief Operating Officer</text>
<line x1="612" y1="204" x2="612" y2="66" stroke-width="1.5" class="line" />
<circle cx="612" cy="210" r="6" class="dot" />
<text x="612" y="80" font-size="13" text-anchor="middle" class="label" >2022 – 2023</text>
<text x="612" y="103" font-size="16" text-anchor="middle" class="title" >Nextory</text>
<text x="612" y="127" font-size="12.5" text-anchor="middle" class="sub" >Country Manager,</text>
<text x="612" y="144" font-size="12.5" text-anchor="middle" class="sub" >Spain</text>
<line x1="786" y1="216" x2="786" y2="236" stroke-width="1.5" class="line" />
<circle cx="786" cy="210" r="6" class="dot" />
<text x="786" y="250" font-size="13" text-anchor="middle" class="label" >2023 – 2024</text>
<text x="786" y="273" font-size="16" text-anchor="middle" class="title" >EF Education First</text>
<text x="786" y="297" font-size="12.5" text-anchor="middle" class="sub" >Managing Director,</text>
<text x="786" y="314" font-size="12.5" text-anchor="middle" class="sub" >LATAM</text>
<line x1="960" y1="204" x2="960" y2="62" stroke-width="1.5" class="line" />
<circle cx="960" cy="210" r="6" class="dot" />
<text x="960" y="76" font-size="13" text-anchor="end" class="label" >2024 – Present</text>
<text x="960" y="99" font-size="16" text-anchor="end" class="title" >N34 Executive</text>
<text x="960" y="120" font-size="16" text-anchor="end" class="title" >Strategy &amp; Innovation</text>
<text x="960" y="144" font-size="12.5" text-anchor="end" class="sub" >Founder &amp; Executive Advisor</text>
</svg>